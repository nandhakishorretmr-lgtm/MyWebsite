<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | MyTech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            padding: 50px 8%;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #00e5ff;
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.08;
            top: -150px;
            right: -100px;
            pointer-events: none;
            z-index: -1;
        }

        /* Header */

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .small-title {
            color: #00e5ff;
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        h1 {
            font-size: clamp(35px, 5vw, 60px);
        }

        .logout {
            padding: 12px 22px;
            border: 1px solid #333;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .logout:hover {
            border-color: #00e5ff;
            color: #00e5ff;
        }

        /* Message cards */

        .messages {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .message-card {
            position: relative;
            padding: 30px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            transition: 0.3s;
        }

        .message-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 15px 40px rgba(0, 229, 255, 0.08);
        }

        .message-number {
            color: #00e5ff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .message-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .email {
            color: #00e5ff;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .message {
            color: #aaa;
            line-height: 1.7;
        }

        /* Empty message */

        .empty {
            padding: 50px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #222;
            border-radius: 20px;
            color: #888;
        }

        /* Mobile */

        @media (max-width: 800px) {

            body {
                padding: 35px 6%;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 25px;
            }

            .messages {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-header">

        <div>
            <p class="small-title">PRIVATE DASHBOARD</p>
            <h1>Messages</h1>
        </div>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>


    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message-card">

                    <div class="message-number">
                        MESSAGE #{{ message[0] }}
                    </div>

                    <h2>{{ message[1] }}</h2>

                    <p class="email">
                        {{ message[2] }}
                    </p>

                    <p class="message">
                        {{ message[3] }}
                    </p>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty">
            No messages yet.
        </div>

    {% endif %}

</body>
</html>
